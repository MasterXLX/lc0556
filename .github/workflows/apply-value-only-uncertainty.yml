name: Apply ValueOnly uncertainty weighting

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch ValueOnlyGo
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/engine.cc")
          text = path.read_text()

          old = """  std::vector<float> comp_q;\n  std::vector<float> pol;\n"""
          new = """  std::vector<float> comp_q;\n  std::vector<float> comp_uncertainty;\n  std::vector<float> pol;\n"""
          if old not in text:
              raise SystemExit("comp_q declaration not found")
          text = text.replace(old, new, 1)

          old = """    if (history.ComputeGameResult() == GameResult::UNDECIDED) {\n      planes.emplace_back(EncodePositionForNN(\n          input_format, history, 8, FillEmptyHistory::FEN_ONLY, nullptr));\n    }\n"""
          new = """    if (history.ComputeGameResult() == GameResult::UNDECIDED) {\n      planes.emplace_back(EncodePositionForNN(\n          input_format, history, 8, FillEmptyHistory::FEN_ONLY, nullptr));\n      comp_uncertainty.push_back(edge.GetWeight());\n    }\n"""
          if old not in text:
              raise SystemExit("child plane block not found")
          text = text.replace(old, new, 1)

          old = """      // NN eval is from the side-to-move perspective, so if the child\n      // position is good for the opponent, it is bad for us.\n      q = -comp_q[comp_idx];\n      ++comp_idx;\n"""
          new = """      // NN eval is from the side-to-move perspective, so if the child\n      // position is good for the opponent, it is bad for us.\n      q = -comp_q[comp_idx];\n      q /= comp_uncertainty[comp_idx];\n      ++comp_idx;\n"""
          if old not in text:
              raise SystemExit("Q evaluation block not found")
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-value-only-uncertainty.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.cc .github/workflows/apply-value-only-uncertainty.yml
          git commit -m "Add uncertainty weighting to ValueOnlyGo"
          git push
